<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Symphony's mark: a ring of eight players, the small circles, around the conductor's point in the
       middle, on a dark slate tile. Drawn for this extension; it borrows no other mark. The ring is the
       Symphony orange (#D97757), the tile the dark slate (#1F2328), the point a warm white so it reads
       on the slate at 16 px. Rasterised to public/icon/{16,32,48,128}.png by scripts/build-assets.mjs,
       which draws the 16 and 32 px sizes from the simpler geometry in that script's SMALL variant. -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#1F2328"/>
  <g fill="#D97757">
    <circle cx="64" cy="22" r="9"/>
    <circle cx="93.7" cy="34.3" r="9"/>
    <circle cx="106" cy="64" r="9"/>
    <circle cx="93.7" cy="93.7" r="9"/>
    <circle cx="64" cy="106" r="9"/>
    <circle cx="34.3" cy="93.7" r="9"/>
    <circle cx="22" cy="64" r="9"/>
    <circle cx="34.3" cy="34.3" r="9"/>
  </g>
  <circle cx="64" cy="64" r="13" fill="#FFF4EC"/>
  <circle cx="64" cy="64" r="5" fill="#1F2328"/>
</svg>
